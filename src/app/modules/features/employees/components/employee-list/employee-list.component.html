
<mat-toolbar class="container-toolbar">
  <span class="container-toolbar-title" [innerText]="'employee.list.title' | translate"></span>
</mat-toolbar>
<mat-card class="container-card">
  <mat-card-content>
    <h3><mat-icon>search</mat-icon> Ricerca</h3>

    <div [formGroup]="filters" fxLayout="row"  fxLayout.xs="column">
      <div fxFlex="40" fxFlex.xs="100" >
          <mat-form-field appearance="standard" style="width:90%;">
              <mat-label>Cerca</mat-label>
              <input matInput  formControlName="term" placeholder="Ricerca per nome">
          </mat-form-field>
      </div>
    </div>

    <div class="table-container" (scroll)="timeoutScroll($event)">
      <table mat-table #table [dataSource]="dataSource" >

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> # </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let element"> {{element.surname}} {{element.name}} </td>
          </ng-container>

          <ng-container matColumnDef="company">
            <th mat-header-cell *matHeaderCellDef> Azienda </th>
            <td mat-cell *matCellDef="let element"> {{element.company}} </td>
          </ng-container>

          <ng-container matColumnDef="enable">
            <th mat-header-cell *matHeaderCellDef> Stato </th>
            <td mat-cell *matCellDef="let element"> {{element.enabled}} </td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef> Action </th>
            <td mat-cell *matCellDef="let element;let i = index;">
                <button
                    mat-icon-button
                    color="primary"
                    aria-label="Example icon button with a home icon"
                    (click)="onClickEditBtn('edit', element,i)">
                    <mat-icon>description</mat-icon>
                </button>
                <button mat-icon-button color="warn" aria-label="Example icon button with a heart icon">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>
      </table>
      <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>
    </div>

  </mat-card-content>

</mat-card>
