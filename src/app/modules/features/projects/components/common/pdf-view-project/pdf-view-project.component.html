<mat-dialog-content>



        <pdf-viewer [src]="pdfSrc"
          [render-text]="true"
          [original-size]="false"
          [autoresize]="true"

          style="width: 100%; height: 80%"
          ></pdf-viewer>



          <div fxLayout="row" fxLayout.xs="column"fxLayoutAlign="start"  fxLayoutGap="30px">
            <div fxFlex="40%">
              <form [formGroup]="form">
                <mat-form-field style="width:100%">
                   <textarea matInput
                  type="text"
                  [placeholder]="'Inserisci note'"
                  formControlName="note"></textarea>
              </mat-form-field>
              </form>
            </div>
            <div fxFlex="60%" *ngIf="this.attachData.length>0">
              <table mat-table [dataSource]="attachData" style="width:100%">

                <!--- Note that these columns can be defined in any order.
                      The actual rendered columns are set as a property on the row definition" -->

                <!-- Position Column -->
                <ng-container matColumnDef="date">
                  <th mat-header-cell *matHeaderCellDef> Data </th>
                  <td mat-cell *matCellDef="let element"> {{element.date | date:"dd/MM/yyyy HH:mm"}} </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="user">
                  <th mat-header-cell *matHeaderCellDef> Utente </th>
                  <td mat-cell *matCellDef="let element"> {{element.user}} </td>
                </ng-container>

                <!-- Weight Column -->
                <ng-container matColumnDef="note">
                  <th mat-header-cell *matHeaderCellDef> Note </th>
                  <td mat-cell *matCellDef="let element"> {{element.note}} </td>
                </ng-container>



                <tr mat-header-row *matHeaderRowDef="['date','user','note']"></tr>
                <tr mat-row *matRowDef="let row; columns: ['date','user','note'];"></tr>
              </table>
            </div>

          </div>

</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Chiudi</button>
  <button mat-button (click)="onSubmitClick()">Aggiorna Informazioni</button>
</mat-dialog-actions>
