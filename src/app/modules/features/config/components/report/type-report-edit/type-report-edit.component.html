  <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="30px">

    <div fxFlex="40" >
        <form [formGroup]="form">
          <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="30px">
            <mat-form-field fxFlex="70">
              <mat-label>Tipo Report</mat-label>
              <mat-select formControlName="type">
                  <mat-option *ngFor="let type of filterOptionsDescriptors.type" [value]="type.value">
                    {{type.title}}
                  </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="30px">
            <mat-form-field fxFlex="70">
              <mat-label>Tipo Istanza</mat-label>
              <mat-select formControlName="typeistance">
                  <mat-option *ngFor="let type of filterOptionsDescriptors.typeistance" [value]="type.value">
                    {{type.title}}
                  </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </form>
    </div>
    <div fxFlex="60" *ngIf="this.mode ==='edit'" >
      <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="30px">
        <button mat-raised-button color="primary" (click)="testDoc(this.record.type)">Anteprima</button>
        <button *ngIf="preview" mat-raised-button color="primary" (click)="download(this.preview)">Download</button>
      </div>
      <h3>Anteprima</h3>
      <ng-container *ngIf="this.preview">
        <pdf-viewer [src]="this.preview"
        [render-text]="true"
        [original-size]="false"
        style="width: 100%; height:65vh;"
        ></pdf-viewer>
      </ng-container>
    </div>
  </div>



  </mat-dialog-content>
  <mat-dialog-actions  >
    <button mat-button color="warn" mat-dialog-close>Chiudi</button>
    <button mat-button color="primary" (click)="onSubmitBtn(this.mode)">{{btnSubmit}}</button>
  </mat-dialog-actions>
