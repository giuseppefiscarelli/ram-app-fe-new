
<mat-toolbar class="container-toolbar">
  <span class="container-toolbar-title" [innerText]="'Gestione Edizioni Istanza'"></span>
</mat-toolbar>


<mat-card class="container-card">
  <mat-card-content>
    <div class="table-container" (scroll)="timeoutScroll($event)">
      <table mat-table #table [dataSource]="dataSource" >

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Id </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef> Descrizione </th>
          <td mat-cell *matCellDef="let element"> {{element.description}} </td>
      </ng-container>

      <ng-container matColumnDef="year">
        <th mat-header-cell *matHeaderCellDef> Anno </th>
        <td mat-cell *matCellDef="let element"> {{element.year}} </td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let element;let i = index;">
          <a
              mat-icon-button
              color="primary"
              aria-label="Example icon button with a home icon"
              [routerLink]="['/config','edit',element.id]">
              <mat-icon>description</mat-icon>
          </a>

      </td>
  </ng-container>

      </table>
    </div>
  </mat-card-content>
</mat-card>
