
<mat-toolbar class="container-toolbar">
  <span class="container-toolbar-title" [innerText]="'layout.menu.items.users.label' | translate"></span>
</mat-toolbar>

<mat-card class="container-card">
  <mat-card-content>
    <h3><mat-icon>search</mat-icon> Ricerca</h3>
    <div [formGroup]="filters" fxLayout="row"  fxLayout.xs="column">
      <div fxFlex="40" fxFlex.xs="100" >
            <mat-form-field appearance="standard" style="width:90%;">
                <mat-label>Cerca</mat-label>
                <input matInput  formControlName="term" placeholder="Ricerca per nome, cognome, email">
            </mat-form-field>
        </div>
        <div fxFlex="25" fxFlex.xs="100" >
            <mat-form-field appearance="standard">
                <mat-label>
                    {{ 'users.list.filters.fields.role.placeholder' | translate }}
                </mat-label>
                <mat-select  formControlName="role">
                    <mat-option *ngFor="let role of filterOptionsDescriptors.role" [value]="role.value">
                        {{ 'users.list.filters.fields.role.values.' + role.title | translate }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>


    </div>
    <div fxLayout="row">
      <button
            mat-raised-button
            color="primary"
            (click)="onClickEditBtn('create')"
            [innerText]="'users.list.button.create' | translate">
        </button>
    </div>
    <div class="table-container" (scroll)="timeoutScroll($event)">
      <table mat-table #table [dataSource]="dataSource" >

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef> Id </th>
              <td mat-cell *matCellDef="let element"> {{element.id}} </td>
          </ng-container>

          <ng-container matColumnDef="fullname">
              <th mat-header-cell *matHeaderCellDef> Nominativo </th>
              <td mat-cell *matCellDef="let element"> {{element.businessName}} </td>
          </ng-container>

          <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef> email </th>
              <td mat-cell *matCellDef="let element"> {{element.email}} </td>
          </ng-container>

          <ng-container matColumnDef="role">
              <th mat-header-cell *matHeaderCellDef> Ruolo Sistema </th>
              <td mat-cell *matCellDef="let element"> {{element | role}} </td>
          </ng-container>


          <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef> Action </th>
              <td mat-cell *matCellDef="let element;let i = index;">
                  <button
                      mat-icon-button
                      color="primary"
                      aria-label="Example icon button with a home icon"
                      (click)="onClickEditBtn('edit', element,i)">
                      <mat-icon>description</mat-icon>
                  </button>

              </td>
          </ng-container>
      </table>
      <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>
  </div>
  </mat-card-content>
</mat-card>
